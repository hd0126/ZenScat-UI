[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zenscat"
version = "0.1.0"
description = "MATLAB-compatible RCWA/FDFD desktop studio written in Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.7,<7",
]
test = [
    "pytest>=7.0",
    "PySide6>=6.7,<7",
]
build = [
    "PyInstaller>=6.10,<7",
]

[project.scripts]
zenscat = "zenscat.app:main"

[project.urls]
Repository = "https://github.com/hd0126/ZenScat-UI"

[tool.hatch.build.targets.wheel]
packages = ["src/zenscat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src/zenscat"]
exclude = ["src/zenscat/gui"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
